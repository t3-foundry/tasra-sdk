# Keeps dependencies current without anyone remembering to look.
#
# This package's entire runtime surface is three crypto libraries and one optional
# peer, so a silent drift there is the thing most worth catching early — the viem
# peer range once permitted a version with a known DoS advisory, and nothing in the
# repo would have noticed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
    groups:
      # The three runtime dependencies move together and deserve their own review.
      noble-crypto:
        patterns: ['@noble/*']
      # vitest and @vitest/coverage-v8 pin each other exactly — the plugin declares
      # `peer vitest@"<the same version>"` — so neither can move without the other.
      # Splitting them produces two PRs that each fail to install. Listed FIRST,
      # because a dependency joins the first group whose rules it matches, and
      # deliberately without the minor/patch cap below, so a major arrives as one
      # coherent PR rather than two that deadlock.
      vitest:
        patterns: ['vitest', '@vitest/*']

      # Toolchain churn is noise; one PR a week is plenty. Minor and patch ONLY —
      # a major in this group takes the whole PR down with it. The first run bundled
      # TypeScript 7, Vitest 5 and @types/node 26 in with four patch bumps, and the
      # tree would not even resolve: TS 7 violates typescript-eslint's peer range
      # (>=4.8.4 <6.1.0). Majors now arrive as their own PRs, which is what a
      # compiler or test-runner migration deserves anyway.
      dev-tooling:
        dependency-type: development
        patterns: ['*']
        exclude-patterns: ['viem', 'ethers', 'vitest', '@vitest/*']
        update-types: [minor, patch]
    ignore:
      # A noble major touches the envelope and FROST paths — it needs a deliberate
      # migration with the conformance vectors, not an automated bump.
      - dependency-name: '@noble/*'
        update-types: [version-update:semver-major]
      # @types/node must track the OLDEST Node we support (engines: >=22.12), not the
      # newest that exists. Typing against a later major lets the compiler accept APIs
      # that are absent on the runtime this package claims to support — the types would
      # pass while a consumer on 22 fails at runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
